<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XP計算ツール</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <div class="container">
        <h1>Flying Blue XP計算ツール</h1>
        <div class="card">
            <div class="row">
                <div class="form-group">
                    <label for="origin">出発地（3レター）</label>
                    <input type="text" id="origin" placeholder="例：HND" maxlength="3" />
                </div>
                <div class="form-group">
                    <label for="via">経由地（3レター）</label>
                    <input type="text" id="via" placeholder="例：PVG" maxlength="3" />
                </div>
                <div class="form-group">
                    <label for="destination">目的地（3レター）</label>
                    <input type="text" id="destination" placeholder="例：CDG" maxlength="3" />
                </div>
            </div>
            <div class="form-group">
                <label for="classType">座席クラス</label>
                <select id="classType">
                    <option value="Economy">エコノミー</option>
                    <option value="PremiumEconomy">プレミアムエコノミー</option>
                    <option value="Business">ビジネス</option>
                    <option value="First">ファースト</option>
                </select>
            </div>
            <div class="form-group">
                <label for="price">往復のチケット金額（円）</label>
                <input type="number" id="price" placeholder="例：300000" min="0" />
            </div>
            <button onclick="calc()">計算する</button>
            <div id="result"></div>
            <p class="calculation-note">
                距離カテゴリは、同梱の空港データにある国コードと座標から判定します。同じ国の空港間はDomestic、国際線は空港間の大圏距離（直線距離）をもとに、2,000マイル未満をMedium、2,000以上3,500マイル未満をLong 1、3,500以上5,000マイル未満をLong 2、5,000マイル以上をLong 3とします。
                <br><br>
                実際の飛行経路やFlying Blue独自の判定とは異なる場合があるため、結果は目安です。空港データの誤り・不足によって正確に判定できない場合もあります。
            </p>
        </div>
    </div>
    <script src="./script.js?v=20261030-roundtrip"></script>
</body>
</html>
